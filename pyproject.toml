[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batchsleuth"
version = "0.1.0"
description = "Counterfactual training-data debugging: trace model regressions to suspicious training batches."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "lightgbm>=4.3",
  "duckdb>=1.0",
  "mlflow>=2.14",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pyarrow>=14",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
batchsleuth = "batchsleuth.cli:main"

[tool.setuptools.packages.find]
include = ["batchsleuth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
